server {
    # IPv4 only: an explicit [::] listen makes nginx refuse to start on
    # hosts without IPv6, and droplets are reachable over IPv4 regardless.
    listen 6969;

    root /usr/share/nginx/html;
    index index.html;

    # The whole site is one hand-edited file; don't let stale copies linger.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript;
}
